<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suggestions admin | The Roast Room</title>
    <meta name="description" content="Developer only admin page for The Roast Room suggestions." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="./dist/styles.css" />

    <script type="module" src="./js/dev/adminLab.js" defer></script>
  </head>

  <body class="min-h-screen bg-background text-text">
    <a class="skipLink" href="#main">Skip to content</a>

    <header class="border-b border-line bg-surface">
      <div class="mx-auto max-w-5xl px-4 py-8">
        <p class="tokenLabel">Developer only admin page</p>
        <h1 class="mt-3 font-display text-3xl uppercase text-text">Suggestions admin</h1>
        <p class="mt-3 max-w-2xl text-sm text-textMuted">
          This page is not linked from public pages and is excluded from the deploy. The
          token lives in memory only and is never stored.
        </p>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-5xl px-4 py-8">
      <form id="adminForm" class="max-w-md" novalidate>
        <label for="adminToken" class="tokenLabel block">Admin token</label>
        <input
          id="adminToken"
          type="password"
          autocomplete="off"
          class="mt-2 w-full rounded-sharp border border-line bg-surface px-3 py-2 text-text focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent"
        />
        <button
          type="submit"
          class="mt-3 rounded-sharp border-2 border-primary bg-primary px-5 py-3 font-display text-lg uppercase tracking-wide text-primaryContrast transition-colors duration-fast ease-standard hover:bg-accent hover:text-background"
        >
          Load
        </button>
      </form>

      <p id="adminStatus" class="mt-4 text-sm text-accent" role="status" aria-live="polite"></p>

      <div class="mt-6 overflow-x-auto">
        <table class="w-full border-collapse">
          <thead>
            <tr>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Name</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Slug</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Votes</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Approved</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Created</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Updated</th>
              <th scope="col" class="border border-line p-2 text-left text-xs tokenLabel">Actions</th>
            </tr>
          </thead>
          <tbody id="adminBody"></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
