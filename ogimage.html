<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OG image lab | The Roast Room</title>
    <meta
      name="description"
      content="Developer only page for generating the social preview image and app icon."
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="./dist/styles.css" />

    <script type="module" src="./js/dev/ogImage.js" defer></script>
  </head>

  <body class="min-h-screen bg-background text-text">
    <a class="skipLink" href="#main">Skip to content</a>

    <header class="border-b border-line bg-surface">
      <div class="mx-auto max-w-5xl px-4 py-8">
        <p class="tokenLabel">Developer only page</p>
        <h1 class="mt-3 font-display text-3xl uppercase text-text">OG image and app icon</h1>
        <p class="mt-3 max-w-2xl text-sm text-textMuted">
          Generates og.png and apple_touch_icon.png. Download each PNG and commit it to the
          repository root. This page is not linked from public pages and is excluded from
          the deploy.
        </p>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-5xl px-4 py-8">
      <section aria-labelledby="ogHeading" class="rounded-sharp border border-line bg-surface p-4">
        <h2 id="ogHeading" class="text-xl text-text">Social preview (1200 by 630)</h2>
        <canvas id="ogCanvas" class="mt-4 block w-full max-w-[600px]"></canvas>
        <button
          id="downloadOg"
          type="button"
          class="mt-4 rounded-sharp border-2 border-primary bg-primary px-5 py-3 font-display text-lg uppercase tracking-wide text-primaryContrast transition-colors duration-fast ease-standard hover:bg-accent hover:text-background"
        >
          Download og.png
        </button>
        <p id="ogStatus" role="status" aria-live="polite" class="mt-3 text-sm text-textMuted"></p>
      </section>

      <section
        aria-labelledby="iconHeading"
        class="mt-8 rounded-sharp border border-line bg-surface p-4"
      >
        <h2 id="iconHeading" class="text-xl text-text">App icon (180 by 180)</h2>
        <canvas id="iconCanvas" class="mt-4 block"></canvas>
        <button
          id="downloadIcon"
          type="button"
          class="mt-4 rounded-sharp border-2 border-primary bg-primary px-5 py-3 font-display text-lg uppercase tracking-wide text-primaryContrast transition-colors duration-fast ease-standard hover:bg-accent hover:text-background"
        >
          Download apple_touch_icon.png
        </button>
        <p id="iconStatus" role="status" aria-live="polite" class="mt-3 text-sm text-textMuted"></p>
      </section>
    </main>
  </body>
</html>
